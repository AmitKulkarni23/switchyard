# AWS us-east-1 on-demand rates used for the right-sized AWS column.
# `bun run prices` checks these against AWS's public price list and stamps `fetched`.
# The price list lacks CloudFront's rates, the free allowances for egress and CloudFront, and SMS:
# those were checked by hand on 2026-11-04 against the sources below and the pages named on their lines.
destination: aws
region: us-east-1
fetched: 2026-11-04
sources:
  - https://aws.amazon.com/fargate/pricing/
  - https://aws.amazon.com/lambda/pricing/
  - https://aws.amazon.com/api-gateway/pricing/
  - https://aws.amazon.com/rds/postgresql/pricing/
  - https://aws.amazon.com/elasticache/pricing/
  - https://aws.amazon.com/dynamodb/pricing/on-demand/
  - https://aws.amazon.com/sqs/pricing/
  - https://aws.amazon.com/s3/pricing/
  - https://aws.amazon.com/vpc/pricing/
  - https://aws.amazon.com/elasticloadbalancing/pricing/
  - https://aws.amazon.com/ec2/pricing/on-demand/
  - https://aws.amazon.com/opensearch-service/pricing/
  - https://aws.amazon.com/kinesis/data-streams/pricing/
  - https://aws.amazon.com/ses/pricing/
  - https://aws.amazon.com/end-user-messaging/pricing/
  - https://aws.amazon.com/cloudfront/pricing/pay-as-you-go/
  - https://aws.amazon.com/api-gateway/pricing/
  - https://aws.amazon.com/cognito/pricing/
rates:
  fargate_vcpu_hour: 0.04048
  fargate_gb_hour: 0.004445
  lambda_request_million: 0.20
  lambda_gb_second: 0.0000166667
  apigw_http_request_million: 1.00
  alb_hour: 0.0225
  alb_lcu_hour: 0.008
  nat_hour: 0.045
  nat_gb_processed: 0.045
  egress_gb: 0.09
  egress_free_gb: 100              # ec2/pricing/on-demand: "100 GB of free data transfer out to the internet"
  rds_postgres_hour: { small: 0.032, medium: 0.065, large: 0.159 }   # db.t4g.small, db.t4g.medium, db.m6g.large
  rds_storage_gb_month: 0.115
  elasticache_hour: { small: 0.032, medium: 0.065, large: 0.149 }    # cache.t4g.small, cache.t4g.medium, cache.m6g.large
  dynamodb_write_million: 0.625
  dynamodb_read_million: 0.125
  dynamodb_storage_gb_month: 0.25
  sqs_request_million: 0.40
  s3_storage_gb_month: 0.023
  opensearch_hour: { small: 0.036, medium: 0.128, large: 0.167 }   # t3.small.search, m6g.large.search, r6g.large.search
  opensearch_storage_gb_month: 0.122
  kinesis_shard_hour: 0.015
  kinesis_put_unit_million: 0.014
  ses_email_thousand: 0.10
  sms_us_message: 0.01195          # End User Messaging SMS price CSV, US 10DLC: 0.00774 + 0.00421 carrier fee
  cloudfront_gb: 0.085             # pay-as-you-go page, US "Next 9TB"
  cloudfront_https_10k: 0.01       # pay-as-you-go page, US HTTPS per 10,000
  cloudfront_free_gb: 1024         # always free: 1 TB out per month
  cloudfront_free_requests: 10000000  # always free: 10M requests per month
  apigw_websocket_message_million: 1.00
  apigw_websocket_connection_minute_million: 0.25
  cognito_mau: 0.015
  cognito_free_mau: 10000
